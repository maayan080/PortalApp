name: release

# push a tag like v1.0.0 to build and publish a release. run it by hand to build the files without
# publishing anything
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
            echo "name=$v" >> "$GITHUB_OUTPUT"
          fi

      # the release key comes from repository secrets. a tagged release without it must fail, a
      # release signed with the wrong key can never be updated over
      - name: set up the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::the ANDROID_KEYSTORE_BASE64 secret is missing, so this release would be signed with the debug key"
              exit 1
            fi
            echo "::warning::no signing key, this test build is signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-portalapp}"
          } > android/key.properties

      - run: flutter pub get
      - name: build the apk
        run: flutter build apk --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ github.run_number }}

      - name: name the file
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk "PortalApp-${{ steps.version.outputs.name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PortalApp-*-android.apk
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
            echo "name=$v" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get
      - name: build for windows
        run: flutter build windows --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ github.run_number }}

      - name: zip it
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "PortalApp-${{ steps.version.outputs.name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PortalApp-*-windows.zip
          if-no-files-found: error

  publish:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # a tag like v1.0.0-beta is marked as a pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
